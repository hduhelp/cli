<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>图书馆实时座位图</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f7fa; --card: #fff; --fill: #f5f7fa; --fill-strong: #e6eaf0; --border: #e6eaf0;
      --text: #17202d; --muted: #596575; --subtle: #657184; --action: #0066cc;
      --on-action: #fff; --primary-soft: #edf5ff; --warning: #b26a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --canvas: #111722; --card: #1a2230; --fill: #111722; --fill-strong: #2e3949; --border: #2e3949;
        --text: #edf2f9; --muted: #b8c2cf; --subtle: #9aa8bb; --action: #80b8ff;
        --on-action: #0d2036; --primary-soft: #17385a; --warning: #ffc933;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--canvas); color: var(--text);
      font: 400 15px/1.45 -apple-system, BlinkMacSystemFont, Roboto, "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .sheet {
      max-width: 1120px; height: 100%; min-height: 390px; margin: auto;
      display: grid; grid-template-rows: auto minmax(140px, 1fr) auto;
      background: var(--card);
    }
    button, select { font: inherit; color: inherit; cursor: pointer; }
    button { border: 0; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
    button:active:not(:disabled) { opacity: .74; }
    button:disabled { cursor: default; }
    .topbar, .details { padding: 12px 16px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .meta, .stats, .legend { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
    .meta { justify-content: space-between; margin-bottom: 8px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    .room-select {
      min-width: 0; flex: 1 1 170px; min-height: 44px; padding: 0 10px;
      border: 0; border-radius: 12px; background: var(--fill); font-weight: 600;
    }
    .segmented { display: flex; flex: 1 1 160px; padding: 3px; border-radius: 24px; background: var(--fill-strong); }
    .segmented button { flex: 1; min-height: 34px; padding: 0 8px; border-radius: 24px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
    .segmented button[aria-pressed="true"] { color: var(--text); background: var(--card); }
    .viewport { position: relative; min-height: 0; overflow: hidden; background: var(--canvas); touch-action: none; cursor: grab; }
    .viewport.dragging { cursor: grabbing; }
    .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--card); outline: 1px solid var(--border); user-select: none; }
    .plan { position: absolute; inset: 0; width: 100%; height: 100%; background: white; pointer-events: none; }
    .seat {
      position: absolute; display: grid; place-items: center; padding: 0;
      min-width: 9px; min-height: 9px; border: 1px solid; border-radius: 3px;
      font-family: inherit; font-size: 10px; font-weight: 600; line-height: 1;
    }
    .available, .recommended { background: var(--primary-soft); border-color: var(--action); color: var(--action); }
    .occupied { background: var(--fill-strong); color: var(--subtle); border-color: var(--subtle); }
    .seat.closed, .swatch.closed { background: var(--fill); color: var(--subtle); border-color: var(--subtle); border-style: dashed; }
    .seat.selected, .swatch.selected { background: var(--action); border-color: var(--action); color: var(--on-action); }
    .seat.selected { outline: 2px solid var(--action); outline-offset: 2px; z-index: 2; }
    .seat.filtered { opacity: .18; }
    .seat:disabled { pointer-events: none; }
    .seat-label { display: none; white-space: nowrap; pointer-events: none; }
    .labels-visible .seat-label { display: block; }
    .socket-mark { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); }
    .seat .socket-mark { position: absolute; top: -3px; right: -3px; pointer-events: none; }
    .seat.recommended::after { content: "★"; position: absolute; left: -4px; top: -5px; color: var(--warning); }
    .map-tools {
      position: absolute; left: 12px; bottom: 12px; display: inline-flex; align-items: center;
      padding: 2px; border: 1px solid var(--border); border-radius: 24px; background: var(--card);
    }
    .map-tools button { min-width: 40px; height: 40px; padding: 0 8px; border-radius: 24px; background: transparent; color: var(--action); font-size: 20px; }
    .map-tools #fit { font-size: 13px; font-weight: 600; }
    .zoom-value { margin: 0 10px 0 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .details { display: grid; gap: 6px; }
    .stats strong { color: var(--text); }
    .legend { gap: 4px 10px; font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .swatch { width: 12px; height: 12px; border-width: 1px; border-style: solid; border-radius: 3px; }
    .recommend-mark { color: var(--warning); font-style: normal; }
    .selection { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .selection-info { min-width: 0; overflow-wrap: anywhere; }
    .selection-empty { color: var(--muted); font-size: 14px; }
    .selection-name { margin: 0; font-size: 15px; font-weight: 600; }
    .selection-ids { margin: 2px 0 0; max-height: 3.5em; overflow: auto; color: var(--muted); font: 12px/1.4 ui-monospace, monospace; user-select: all; }
    .confirm { flex: none; min-height: 44px; padding: 0 20px; border-radius: 24px; font-weight: 600; color: var(--on-action); background: var(--action); }
    .confirm:disabled { color: var(--muted); background: var(--fill-strong); }
    [hidden] { display: none !important; }
    @media (min-width: 700px) {
      .controls { flex-wrap: nowrap; }
      .segmented { flex: 0 0 240px; }
      .topbar, .details { padding: 14px 20px; }
      .details { grid-template-columns: 1fr auto; align-items: center; }
      .selection { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="topbar">
      <h1>实时座位图</h1>
      <div class="meta"><span id="timeSummary"></span><span id="querySummary"></span></div>
      <div class="controls">
        <select id="roomSelect" class="room-select" aria-label="选择房间"></select>
        <div class="segmented" role="group" aria-label="座位筛选">
          <button type="button" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="available" aria-pressed="false">空闲</button>
          <button type="button" data-filter="socket" aria-pressed="false">插座</button>
        </div>
      </div>
    </header>
    <section id="viewport" class="viewport" aria-label="座位平面图">
      <div id="world" class="world"><img id="plan" class="plan" alt=""><div id="seats"></div></div>
      <div class="map-tools">
        <button id="zoomOut" type="button" aria-label="缩小">−</button>
        <button id="fit" type="button">适应</button>
        <button id="zoomIn" type="button" aria-label="放大">+</button>
        <span id="zoomValue" class="zoom-value">100%</span>
      </div>
    </section>
    <footer class="details">
      <div class="stats">
        <span>本室 <strong id="seatCount">0</strong> 座</span>
        <span>空座 <strong id="availableCount">0</strong></span>
        <span>带插座 <strong id="socketCount">0</strong></span>
      </div>
      <div class="legend" aria-label="图例">
        <span><i class="swatch available"></i>可预约</span><span><i class="swatch selected"></i>已选</span>
        <span><i class="swatch occupied"></i>已占用</span><span><i class="swatch closed"></i>关闭</span>
        <span id="recommendLegend" hidden><i class="recommend-mark">★</i>推荐</span><span><i class="socket-mark"></i>插座</span>
      </div>
      <div class="selection">
        <div class="selection-info" aria-live="polite">
          <span id="selectionEmpty" class="selection-empty">请选择座位</span>
          <div id="selectionValue" hidden><p id="selectionName" class="selection-name"></p>
            <p id="selectionIds" class="selection-ids"></p></div>
        </div>
        <button id="copySelection" class="confirm" type="button" disabled>复制选择</button>
      </div>
    </footer>
  </main>
  <script>
    "use strict";
    const data = __HDU_LIBRARY_BOOKING_DATA__;
    const unit = 8;
    const state = { roomIndex: 0, filter: "all", scale: 1, x: 0, y: 0, selected: null };
    const el = Object.fromEntries(["roomSelect","recommendLegend","timeSummary","viewport","world","plan","seats","seatCount","availableCount","socketCount","selectionEmpty","selectionValue","selectionName","selectionIds","copySelection","zoomOut","zoomIn","fit","querySummary","zoomValue"].map(id => [id, document.getElementById(id)]));

    function seatClass(seat) {
      if (seat.recommended) return "recommended";
      if (seat.state === 0) return "available";
      if (seat.state === 3) return "closed";
      if (seat.state === 1 || seat.state === 4 || seat.state === 5) return "occupied";
      return "closed";
    }

    function currentRoom() { return data.rooms[state.roomIndex]; }
    function matchesFilter(seat) {
      if (state.filter === "available") return seat.available;
      if (state.filter === "socket") return seat.hasSocket;
      return true;
    }

    function renderRoom() {
      const room = currentRoom();
      if (!room) return;
      state.selected = null;
      updateSelection();
      const width = Math.max(Number(room.width) * unit, 320);
      const height = Math.max(Number(room.height) * unit, 240);
      el.world.style.width = `${width}px`;
      el.world.style.height = `${height}px`;
      if (room.planUrl) el.plan.src = room.planUrl;
      else el.plan.removeAttribute("src");
      el.plan.hidden = !room.planUrl;
      el.seats.replaceChildren();
      for (const seat of room.seats) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `seat ${seatClass(seat)}${seat.available ? " selectable" : ""}`;
        button.style.left = `${Number(seat.x) * unit}px`;
        button.style.top = `${Number(seat.y) * unit}px`;
        button.style.width = `${Math.max(Number(seat.width) * unit, 9)}px`;
        button.style.height = `${Math.max(Number(seat.height) * unit, 9)}px`;
        button.dataset.seatId = seat.seatId;
        button.title = `${room.name} ${seat.label} · ${seat.available ? "可预约" : "不可预约"}${seat.hasSocket ? " · 带插座" : ""}`;
        button.disabled = !seat.available;
        button.setAttribute("aria-label", button.title);
        const label = document.createElement("span");
        label.className = "seat-label";
        label.textContent = seat.label;
        button.append(label);
        if (seat.hasSocket) {
          const socket = document.createElement("span");
          socket.className = "socket-mark";
          button.append(socket);
        }
        button.addEventListener("click", event => {
          event.stopPropagation();
          selectSeat(room, seat, button);
        });
        el.seats.append(button);
      }
      el.recommendLegend.hidden = !room.seats.some(seat => seat.recommended && seat.available);
      el.seatCount.textContent = room.seats.length;
      el.availableCount.textContent = room.seats.filter(seat => seat.available).length;
      el.socketCount.textContent = room.seats.filter(seat => seat.hasSocket).length;
      applyFilter();
      requestAnimationFrame(fitMap);
    }

    function selectSeat(room, seat, button) {
      el.seats.querySelectorAll(".selected").forEach(item => item.classList.remove("selected"));
      button.classList.add("selected");
      state.selected = { roomId: room.roomId, roomName: room.name, seatId: seat.seatId, seatLabel: seat.label };
      updateSelection();
    }

    function updateSelection() {
      const selected = state.selected;
      el.selectionEmpty.hidden = Boolean(selected);
      el.selectionValue.hidden = !selected;
      el.copySelection.disabled = !selected;
      if (!selected) return;
      el.selectionName.textContent = `${selected.roomName} · ${selected.seatLabel}号`;
      el.selectionIds.textContent = `roomId=${selected.roomId}\nseatId=${selected.seatId}`;
    }

    function applyFilter() {
      const room = currentRoom();
      if (!room) return;
      el.seats.querySelectorAll(".seat").forEach((button, index) => button.classList.toggle("filtered", !matchesFilter(room.seats[index])));
      document.querySelectorAll("[data-filter]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === state.filter)));
    }

    function applyTransform() {
      el.world.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      el.world.classList.toggle("labels-visible", state.scale >= 1);
      el.zoomValue.textContent = `${Math.round(state.scale * 100)}%`;
    }

    function fitMap() {
      const viewport = el.viewport.getBoundingClientRect();
      const width = el.world.offsetWidth;
      const height = el.world.offsetHeight;
      if (!viewport.width || !viewport.height || !width || !height) return;
      state.scale = Math.min((viewport.width - 36) / width, (viewport.height - 36) / height, 1.25);
      state.scale = Math.max(state.scale, 0.15);
      state.x = (viewport.width - width * state.scale) / 2;
      state.y = (viewport.height - height * state.scale) / 2;
      applyTransform();
    }

    function zoomAt(nextScale, clientX, clientY) {
      const bounds = el.viewport.getBoundingClientRect();
      const px = clientX - bounds.left;
      const py = clientY - bounds.top;
      const worldX = (px - state.x) / state.scale;
      const worldY = (py - state.y) / state.scale;
      state.scale = Math.min(4, Math.max(0.15, nextScale));
      state.x = px - worldX * state.scale;
      state.y = py - worldY * state.scale;
      applyTransform();
    }

    el.roomSelect.addEventListener("change", () => { state.roomIndex = Number(el.roomSelect.value); renderRoom(); });
    document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => { state.filter = button.dataset.filter; applyFilter(); }));
    el.zoomIn.addEventListener("click", () => { const b = el.viewport.getBoundingClientRect(); zoomAt(state.scale * 1.25, b.left + b.width / 2, b.top + b.height / 2); });
    el.zoomOut.addEventListener("click", () => { const b = el.viewport.getBoundingClientRect(); zoomAt(state.scale / 1.25, b.left + b.width / 2, b.top + b.height / 2); });
    el.fit.addEventListener("click", fitMap);
    el.viewport.addEventListener("wheel", event => { event.preventDefault(); zoomAt(state.scale * (event.deltaY < 0 ? 1.12 : 0.89), event.clientX, event.clientY); }, { passive: false });
    const pointers = new Map();
    let moved = false;
    el.viewport.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest(".map-tools") || pointers.size >= 2) return;
      moved = pointers.size > 0;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      // Keep an ordinary tap targeted at the seat, including when its label was hit.
      const target = event.target.closest(".seat") || el.viewport;
      target.setPointerCapture(event.pointerId);
    });
    el.viewport.addEventListener("pointermove", event => {
      const previous = pointers.get(event.pointerId);
      if (!previous) return;
      const next = { x: event.clientX, y: event.clientY };
      const dx = next.x - previous.x;
      const dy = next.y - previous.y;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      el.viewport.classList.add("dragging");
      pointers.set(event.pointerId, next);
      if (pointers.size === 1) {
        state.x += dx;
        state.y += dy;
        applyTransform();
        return;
      }
      const [first, second] = pointers.values();
      const other = first === next ? second : first;
      const before = Math.hypot(previous.x - other.x, previous.y - other.y);
      const after = Math.hypot(next.x - other.x, next.y - other.y);
      // Each pointer event moves half of the two-finger midpoint.
      state.x += dx / 2;
      state.y += dy / 2;
      zoomAt(before > 0 ? state.scale * after / before : state.scale,
        (next.x + other.x) / 2, (next.y + other.y) / 2);
    });
    function releasePointer(event) {
      if (event.type === "pointerup" && event.pointerType === "touch" && pointers.has(event.pointerId) && !moved) {
        // Android WebView may omit a synthetic click after a pinch.
        event.target.closest(".seat:not(:disabled)")?.click();
      }
      pointers.delete(event.pointerId);
      if (!pointers.size) el.viewport.classList.remove("dragging");
    }
    el.viewport.addEventListener("pointerup", releasePointer);
    el.viewport.addEventListener("pointercancel", releasePointer);
    el.viewport.addEventListener("lostpointercapture", releasePointer);
    el.seats.addEventListener("click", event => {
      if (event.detail > 0 && (moved || event.pointerType === "touch")) event.stopPropagation();
    }, true);
    el.copySelection.addEventListener("click", async () => {
      if (!state.selected) return;
      const text = JSON.stringify(state.selected);
      try { await navigator.clipboard.writeText(text); el.copySelection.textContent = "已复制"; }
      catch { el.selectionIds.textContent = text; }
      setTimeout(() => { el.copySelection.textContent = "复制选择"; }, 1200);
    });
    el.plan.addEventListener("error", () => { el.plan.hidden = true; });
    el.plan.addEventListener("load", () => { el.plan.hidden = false; });
    window.addEventListener("resize", fitMap);

    for (const [index, room] of data.rooms.entries()) {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = `${room.name} · 空 ${room.seats.filter(seat => seat.available).length}`;
      el.roomSelect.append(option);
    }
    el.timeSummary.textContent = `${data.date || ""} ${data.beginTime || ""}–${data.endTime || ""} · 1人`;
    el.querySummary.textContent = `实时查询 ${data.queriedAt || ""} · ${data.availableSeatCount ?? 0} 个可预约座位`;
    if (data.rooms.length === 0) {
      el.selectionEmpty.textContent = "暂无可显示的房间";
      el.roomSelect.disabled = true;
    } else {
      renderRoom();
    }
  </script>
</body>
</html>
